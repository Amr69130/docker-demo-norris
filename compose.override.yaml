# Réglages propres à l'environnement de développement.
services:
  web:
    ports: !override
      - target: ${ORO_NGINX_HTTP_PORT}
        published: "${ORO_HTTP_PORT:-80}"
        protocol: tcp

  mail:
    ports:
      - target: 8025
        published: "${MAILHOG_HTTP_PORT:-8025}"
        host_ip: 127.0.0.1
        protocol: tcp
